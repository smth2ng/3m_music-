<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Артисты — управление</title><link rel="stylesheet" href="../style.css"><script src="./admin.js" type="module"></script></head>
<body><main class="admin-page">
<a class="text-link" href="../index.html">На сайт</a><h1>Управление сайтом</h1>
<p>Деморежим. Изменения сохраняются только в этом браузере. Пароль проверяется в коде страницы.</p>
<form id="login"><label>Пароль<input id="password" type="password" required autocomplete="current-password"></label><button class="cta">Войти</button></form>
<p id="status" role="status" aria-live="polite"></p>
<section id="workspace" hidden><button id="logout" type="button">Выйти</button><h2>Артисты</h2><div id="artist-list"></div><button id="new" type="button">Добавить артиста</button>
<form id="editor" hidden>
<h2 id="editor-title">Новый артист</h2>
<div class="editor-page-layout">
<div class="editor-media">
<label>Название группы<input name="name" required maxlength="160" placeholder="Название артиста"></label>
<label>Логотип<input name="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="logo-preview" class="artist-logo" alt="Логотип" hidden>
<label><input name="removeLogo" type="checkbox"> Удалить логотип</label>
<label>Фотографии<input name="photos" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><div id="gallery-list"></div><div id="new-gallery" class="artist-gallery"></div>
<label>Видео<input name="video" type="url" placeholder="https://…"></label><a id="video-preview" class="video-link" target="_blank" rel="noopener noreferrer" hidden>▶ Смотреть видео</a>
</div>
<div class="editor-info">
<label>Главное фото<input name="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="photo-preview" class="artist-main-photo" alt="Главное фото" hidden>
<label>Описание<textarea name="description" rows="6" maxlength="10000" placeholder="Расскажите об артисте"></textarea></label>
<label>Ссылки на платформы<textarea name="links" rows="4" placeholder="Яндекс Музыка | https://music.yandex.ru/…"></textarea></label><p>Одна строка — название платформы | HTTPS-ссылка.</p><div id="links-preview" class="platform-links"></div>
</div></div>
<div class="admin-actions"><button class="cta" type="submit">Сохранить</button><button id="cancel" type="button">Отмена</button><button id="delete" type="button">Удалить артиста</button></div>
</form>
<section class="teacher-admin" aria-labelledby="teacher-admin-title">
<h2 id="teacher-admin-title">Преподаватели</h2>
<div id="teacher-admin-list" class="admin-actions"></div>
<button id="teacher-new" type="button">Добавить преподавателя</button>
<form id="teacher-editor" hidden>
<h3 id="teacher-editor-title">Новый преподаватель</h3>
<label>Имя<input name="name" required maxlength="160"></label>
<label>Фото<input name="photo" type="file" accept="image/png,image/jpeg,image/webp"></label>
<img id="teacher-photo-preview" class="admin-preview" alt="Фото преподавателя" hidden>
<label><input name="removePhoto" type="checkbox"> Удалить фото</label>
<label>Описание<textarea name="description" rows="5" maxlength="10000"></textarea></label>
<div class="admin-actions"><button class="cta" type="submit">Сохранить преподавателя</button><button id="teacher-cancel" type="button">Отмена</button><button id="teacher-delete" type="button" hidden>Удалить преподавателя</button></div>
</form>
</section>
<section class="teacher-admin" aria-labelledby="release-admin-title">
<h2 id="release-admin-title">Недавние релизы</h2>
<div id="release-admin-list" class="admin-actions"></div>
<button id="release-new" type="button">Добавить релиз</button>
<form id="release-editor" hidden>
<h3 id="release-editor-title">Новый релиз</h3>
<label>Название релиза<input name="title" required maxlength="160"></label>
<label>Артист<select name="artist" required></select></label>
<label>Обложка<input name="photo" type="file" accept="image/png,image/jpeg,image/webp"></label>
<img id="release-preview" class="admin-preview" alt="Обложка релиза" hidden>
<label>Ссылка для кнопки «Слушать»<input name="url" type="url" placeholder="https://…" required></label>
<div class="admin-actions"><button class="cta" type="submit">Сохранить релиз</button><button id="release-cancel" type="button">Отмена</button></div>
</form></section></section>
</main></body></html>
